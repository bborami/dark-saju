<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어둠의 사주 · 냥선생의 독설 만세력</title>
<meta name="description" content="생년월일만 넣으면 냥선생이 만세력 뽑아서 독설로 할퀴어 줌. 좋은 말 들으러 왔으면 번지수 틀렸다.">
<meta name="theme-color" content="#0b0f2a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="어둠의 사주">
<meta property="og:title" content="어둠의 사주 · 냥선생의 독설 만세력">
<meta property="og:description" content="생년월일만 넣어. 냥선생이 네 사주를 할퀴어 줄 테니. 좋은 말 들으러 왔으면 번지수 틀렸다.">
<meta property="og:url" content="https://bborami.github.io/dark-saju/">
<meta property="og:image" content="https://bborami.github.io/dark-saju/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://bborami.github.io/dark-saju/og.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#05060f; --navy:#0b0f2a; --violet:#2a1748; --lav:#a99bd6; --mist:#cfc6f0;
  --gold:#e8c56b; --gold2:#f6e2a3; --rose:#b3263a; --blue:#8fb2ff; --text:#e9e4f7; --dim:#9a92b8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:"Gowun Batang","Nanum Myeongjo",serif;color:var(--text);
  background:radial-gradient(120% 80% at 70% 0%,#2b1a52 0%,#120c2c 40%,#05060f 80%);
  background-color:var(--ink);overflow-x:hidden;line-height:1.75;
}
/* ---------- 배경 레이어 ---------- */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.smoke{position:fixed;border-radius:50%;filter:blur(60px);opacity:.28;z-index:1;pointer-events:none;mix-blend-mode:screen}
.smoke.s1{width:60vw;height:40vh;left:-15vw;top:20vh;background:#6c55b8;animation:drift1 28s ease-in-out infinite alternate}
.smoke.s2{width:55vw;height:45vh;right:-20vw;top:45vh;background:#3d2f7d;animation:drift2 34s ease-in-out infinite alternate}
.smoke.s3{width:40vw;height:30vh;left:30vw;top:-5vh;background:#8a76c9;opacity:.16;animation:drift1 40s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(18vw,-6vh) scale(1.25)}}
@keyframes drift2{to{transform:translate(-22vw,8vh) scale(1.15)}}
#fog{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:.35;mix-blend-mode:screen}
#water{position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:1;pointer-events:none;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 100%);mask-image:linear-gradient(to top,#000 10%,transparent 100%);opacity:.55}
#water svg{width:100%;height:100%}
.mote{position:fixed;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--gold2);box-shadow:0 0 8px 2px rgba(246,226,163,.7);z-index:2;pointer-events:none;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-105vh) translateX(30px);opacity:0}}
.petal{position:fixed;top:-20px;z-index:2;pointer-events:none;font-size:13px;color:var(--blue);opacity:.7;animation:fall linear infinite;text-shadow:0 0 6px rgba(143,178,255,.8)}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

main{position:relative;z-index:3;max-width:760px;margin:0 auto;padding:28px 18px 120px}

/* ---------- 헤더 ---------- */
.hero{text-align:center;position:relative;padding-top:10px}
.moonwrap{position:relative;width:230px;height:230px;margin:0 auto 18px}
.moon{position:absolute;inset:0;border-radius:50%;
  box-shadow:-34px 14px 0 4px var(--gold);transform:rotate(-18deg);
  filter:drop-shadow(0 0 22px rgba(232,197,107,.55)) drop-shadow(0 0 60px rgba(232,197,107,.25));left:40px}
.halo{position:absolute;inset:-26px;border-radius:50%;border:1px solid rgba(232,197,107,.25);animation:spin 60s linear infinite}
.halo:before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(169,155,214,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.cat{position:absolute;left:44px;bottom:4px;width:118px;height:186px;overflow:visible}
.cat .tail{transform-origin:92px 184px;animation:tail 6s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-3deg)}to{transform:rotate(4deg)}}
.cat .ember{animation:ember 3.2s ease-in-out infinite}
@keyframes ember{50%{opacity:.45}}
.cat .smk{stroke-dasharray:10 260;animation:smk 6s linear infinite}
.cat .smk.b{animation-delay:-3s}
@keyframes smk{0%{stroke-dashoffset:0;opacity:0}15%{opacity:.8}100%{stroke-dashoffset:-220;opacity:0}}
.cat .haze{animation:haze 7s ease-in-out infinite alternate}
@keyframes haze{from{opacity:.35;transform:translateX(0)}to{opacity:.6;transform:translateX(3px)}}
h1{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:clamp(38px,8vw,58px);letter-spacing:.12em;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#9c7a2c);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(232,197,107,.25);margin-top:6px}
.sub{color:var(--lav);letter-spacing:.3em;font-size:13px;margin-top:-4px}
.bubble{display:inline-block;margin:22px auto 0;padding:12px 18px;border-radius:16px;background:rgba(10,8,28,.7);
  border:1px solid rgba(232,197,107,.35);position:relative;font-size:15px;max-width:520px}
.bubble:before{content:"";position:absolute;top:-8px;left:50%;width:14px;height:14px;background:inherit;border-left:1px solid rgba(232,197,107,.35);border-top:1px solid rgba(232,197,107,.35);transform:translateX(-50%) rotate(45deg);background:#0c0a22}
.bubble b{color:var(--gold)}

/* ---------- 폼 ---------- */
.panel{margin-top:30px;padding:26px 22px;border-radius:20px;background:linear-gradient(160deg,rgba(32,22,66,.72),rgba(8,9,26,.82));
  border:1px solid rgba(169,155,214,.22);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 40px rgba(108,85,184,.08);backdrop-filter:blur(6px)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.field{flex:1 1 150px;display:flex;flex-direction:column;gap:6px}
label{font-size:13px;color:var(--dim);letter-spacing:.08em}
input,select{font-family:inherit;font-size:16px;color:var(--text);background:rgba(5,6,15,.6);border:1px solid rgba(169,155,214,.3);border-radius:12px;padding:11px 12px;outline:none;color-scheme:dark}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,197,107,.15)}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--dim)}
.check input{width:18px;height:18px;accent-color:var(--gold)}
.btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer;border-radius:14px;font-size:16px;padding:13px 18px;border:1px solid rgba(232,197,107,.55);transition:.2s}
.primary{flex:2 1 220px;background:linear-gradient(180deg,#3a2668,#1a1238);color:var(--gold2);font-weight:700;letter-spacing:.1em;box-shadow:0 0 24px rgba(232,197,107,.15)}
.primary:hover{box-shadow:0 0 34px rgba(232,197,107,.35);transform:translateY(-1px)}
.ghost{flex:1 1 140px;background:transparent;color:var(--lav);border-color:rgba(169,155,214,.35)}
.ghost:hover{color:var(--gold2);border-color:var(--gold)}
.note{font-size:12px;color:var(--dim);margin-top:12px}

/* ---------- 로딩 ---------- */
#loading{display:none;text-align:center;margin:40px 0;color:var(--lav)}
#loading .orb{width:70px;height:70px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d6,var(--gold) 40%,#6b4e14 75%);box-shadow:0 0 40px rgba(232,197,107,.6);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.88);opacity:.7}}

/* ---------- 결과 ---------- */
#result{display:none;margin-top:30px}
.sec-title{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:20px;color:var(--gold);letter-spacing:.12em;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.sec-title:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(232,197,107,.5),transparent)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pillar{text-align:center;border-radius:16px;padding:12px 6px 14px;background:rgba(8,9,26,.7);border:1px solid rgba(169,155,214,.22)}
.pillar.day{border-color:var(--gold);box-shadow:0 0 22px rgba(232,197,107,.22)}
.pillar .lbl{font-size:12px;color:var(--dim);letter-spacing:.1em}
.gz{margin:6px auto;width:62px;height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Nanum Myeongjo",serif;font-size:30px;font-weight:800;line-height:1}
.gz small{font-size:11px;font-weight:400;margin-top:4px;font-family:"Gowun Batang",serif;opacity:.85}
.e0{background:rgba(64,140,96,.22);color:#9fe0b5;border:1px solid rgba(120,200,150,.4)}
.e1{background:rgba(179,38,58,.22);color:#ff9aa6;border:1px solid rgba(220,90,110,.45)}
.e2{background:rgba(180,140,60,.2);color:#f1cf86;border:1px solid rgba(220,180,90,.45)}
.e3{background:rgba(200,200,220,.12);color:#eceaf6;border:1px solid rgba(220,220,240,.4)}
.e4{background:rgba(60,90,200,.22);color:#a8bfff;border:1px solid rgba(110,140,240,.45)}
.empty{background:rgba(255,255,255,.03);color:var(--dim);border:1px dashed rgba(169,155,214,.3);font-size:22px}
.ilju{text-align:center;margin-top:14px;font-size:15px;color:var(--mist)}
.ilju b{color:var(--gold2);font-size:18px}
.elements{margin-top:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.el{text-align:center;font-size:13px;color:var(--dim)}
.el .bar{height:70px;border-radius:10px;background:rgba(255,255,255,.04);position:relative;overflow:hidden;margin-bottom:6px;border:1px solid rgba(169,155,214,.15)}
.el .fill{position:absolute;left:0;right:0;bottom:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.el b{display:block;color:var(--text);font-size:15px}
.elcap{margin-top:10px;font-size:14px;color:var(--lav);text-align:center}

.cards{display:grid;gap:14px}
.card{border-radius:18px;padding:18px 18px 18px 18px;background:linear-gradient(165deg,rgba(30,20,62,.78),rgba(7,8,22,.88));
  border:1px solid rgba(169,155,214,.2);position:relative;overflow:hidden;opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}
.card.show{opacity:1;transform:none}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 100% 0%,rgba(232,197,107,.08),transparent 70%);pointer-events:none}
.card h3{display:flex;align-items:center;gap:12px;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:18px;color:var(--gold2);margin-bottom:8px}
.ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(232,197,107,.12);border:1px solid rgba(232,197,107,.3)}
.card p{font-size:15.5px;color:var(--text)}
.card p + p{margin-top:8px}
.card .hl{color:var(--gold2)}
.card.catcard{border-color:rgba(232,197,107,.55);background:linear-gradient(165deg,rgba(40,26,8,.55),rgba(10,8,24,.92))}
.card.catcard p{font-size:17px;font-family:"Nanum Myeongjo",serif;font-weight:700;color:var(--gold2)}
.card.warn{border-color:rgba(179,38,58,.5)}
.card.warn h3{color:#ffb4bd}
.disclaimer{text-align:center;font-size:12px;color:var(--dim);margin-top:30px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);opacity:0;background:#1a1238;border:1px solid var(--gold);color:var(--gold2);padding:10px 18px;border-radius:12px;z-index:10;transition:.3s}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:520px){.gz{width:52px;height:52px;font-size:25px}.moonwrap{width:190px;height:190px}.cat{width:98px;height:154px;left:38px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="smoke s1"></div><div class="smoke s2"></div><div class="smoke s3"></div>

<!-- 연기 질감 -->
<svg id="fog" preserveAspectRatio="none" aria-hidden="true">
  <filter id="smokeF" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="4" seed="7">
      <animate attributeName="baseFrequency" dur="60s" values="0.006 0.012;0.009 0.016;0.006 0.012" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix values="0 0 0 0 0.62  0 0 0 0 0.55  0 0 0 0 0.9  0 0 0 1.4 -0.55"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#smokeF)"/>
</svg>

<!-- 금빛 물결 -->
<div id="water" aria-hidden="true">
  <svg preserveAspectRatio="none">
    <filter id="caustic" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.03" numOctaves="2" seed="3">
        <animate attributeName="baseFrequency" dur="18s" values="0.012 0.03;0.016 0.026;0.012 0.03" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.78  0 0 0 0 0.38  0 0 0 -3.2 1.15"/>
    </filter>
    <rect width="100%" height="100%" fill="#0a0c24"/>
    <rect width="100%" height="100%" filter="url(#caustic)"/>
  </svg>
</div>

<main>
  <header class="hero">
    <div class="moonwrap">
      <div class="halo"></div>
      <div class="moon"></div>
      <!-- 검은고양이 냥선생 -->
      <svg class="cat" viewBox="0 0 130 205" aria-label="달 위에서 고개를 들고 연기를 피우는 검은고양이 냥선생">
        <defs>
          <filter id="fur" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter>
          <filter id="glow"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <linearGradient id="earG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2948"/><stop offset="1" stop-color="#120d1d"/></linearGradient><linearGradient id="faceRim" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2a3" stop-opacity=".15"/><stop offset=".45" stop-color="#fff1c8" stop-opacity=".85"/><stop offset="1" stop-color="#cfc6f0" stop-opacity=".25"/></linearGradient>
          <filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
          <filter id="soft2"><feGaussianBlur stdDeviation="4"/></filter>
          <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1c8" stop-opacity=".9"/><stop offset=".55" stop-color="#e8c56b" stop-opacity=".35"/><stop offset="1" stop-color="#e8c56b" stop-opacity="0"/></linearGradient>
        </defs>
        <!-- 연기 -->
        <g class="haze" filter="url(#soft2)"><ellipse cx="0" cy="10" rx="13" ry="24" fill="#cfc6f0" opacity=".22"/><ellipse cx="2" cy="-36" rx="12" ry="22" fill="#cfc6f0" opacity=".16"/><ellipse cx="-1" cy="-76" rx="10" ry="18" fill="#cfc6f0" opacity=".1"/></g>
        <g filter="url(#soft)" fill="none" stroke-linecap="round">
          <path d="M1 41 C-14 31 14 22 2 8 C-10 -4 13 -15 0 -29 C-12 -41 11 -51 -2 -65 C-9 -73 5 -82 0 -94" stroke="#d8d0f2" stroke-width="3.2" opacity=".5"/>
          <path class="smk" d="M1 41 C-14 31 14 22 2 8 C-10 -4 13 -15 0 -29 C-12 -41 11 -51 -2 -65 C-9 -73 5 -82 0 -94" stroke="#efeaff" stroke-width="3.4"/>
          <path class="smk b" d="M1 41 C-14 31 14 22 2 8 C-10 -4 13 -15 0 -29 C-12 -41 11 -51 -2 -65 C-9 -73 5 -82 0 -94" stroke="#efeaff" stroke-width="3"/>
        </g>
        <!-- 꼬리 -->
        <path class="tail" d="M92 184 C108 192 104 201 76 201 C54 201 38 200 28 195 C21 191 22 184 29 186" stroke="#06050d" stroke-width="6.5" fill="none" stroke-linecap="round" filter="url(#fur)"/>
        <!-- 몸 -->
        <path d="M15.5 30 C16 28 17.5 26.5 19.5 26 C21.5 25.5 23 24.5 25 22.5 C28 18 34 13 44 8 L54 0 C55 -1 56 0 56 1 L57 12 C59 13 60 14 61 15 L68 8 C69 7 70 8 70 9 L67 24 C69 32 67 40 66 48 C68 62 78 80 90 100 C104 122 110 148 106 168 C104 180 98 188 90 191 L36 191 C29 191 27 186 30 182 C35 175 36 162 33 146 C30 130 20 110 18 92 C16 76 22 62 24 52 C24 47 23 43 21 40.5 C19.5 39.5 18 38.6 17 37.4 C16 36.2 15.6 35 15.2 33.6 C14.8 32.2 15 31 15.5 30 Z" fill="#06050d" filter="url(#fur)"/>
        <!-- 털끝 림라이트 (머리 뒤, 귀, 등) -->
        <path d="M57 12 C59 13 60 14 61 15 L68 8 C69 7 70 8 70 9 L67 24 C69 32 67 40 66 48 C68 62 78 80 90 100 C104 122 110 148 106 168" stroke="url(#rim)" stroke-width="1.3" fill="none" filter="url(#fur)"/>
        <path d="M44 8 L54 0 C55 -1 56 0 56 1 L57 12" stroke="#f6e2a3" stroke-width=".8" fill="none" opacity=".55" filter="url(#fur)"/>
        <path d="M20 40 C23 44 24 48 24 52 C22 62 16 76 18 92" stroke="#cfc6f0" stroke-width=".8" fill="none" opacity=".25" filter="url(#fur)"/>
        <!-- 귀 안쪽 -->
        <path d="M46.5 8.6 L53.6 2.6 L55.2 11.6 C52 10.4 49 9.4 46.5 8.6 Z" fill="url(#earG)"/>
        <path d="M49 8.4 L53 4.6 M50.6 9.4 L54 6.4 M52.4 10.4 L54.6 8.6" stroke="#8d7aa8" stroke-width=".3" opacity=".55"/>
        <!-- 얼굴 윤곽 빛 (이마-콧등-주둥이-턱) -->
        <path d="M44 8 C34 13 28 18 25 22.5 C23 24.5 21.5 25.5 19.5 26 C17.5 26.5 16 28 15.5 30 C15 31 14.8 32.2 15.2 33.6 C15.6 35 16 36.2 17 37.4 C18 38.6 19.5 39.5 21 40.5" stroke="url(#faceRim)" stroke-width=".75" fill="none" filter="url(#glow)"/>
        <!-- 코 -->
        <path d="M15.6 29.6 C16.4 28.6 17.6 28.4 18.4 29.2 C17.6 30 16.6 30.6 15.6 30.4 Z" fill="#241a33"/>
        <path d="M16.8 30.4 L17 32.4 C17.6 33.4 18.6 33.6 19.6 33.2" stroke="#3a2f52" stroke-width=".4" fill="none"/>
        <!-- 눈썹 털 -->
        <path d="M33 18.6 Q36 17.2 39 18.4 M35 17.4 Q38 14.6 42 15.4" stroke="#b9acd9" stroke-width=".35" fill="none" opacity=".55"/>
        <!-- 지그시 감은 눈 + 속눈썹 -->
        <path d="M29.4 23.2 Q34.6 26.9 40.6 22.4" stroke="#05040c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M29.6 23.6 Q34.6 26.6 40.4 22.8" stroke="#f6e2a3" stroke-width=".7" fill="none" stroke-linecap="round" filter="url(#glow)"/>
        <path d="M30.6 24.6 L29.2 26.4 M32.6 25.6 L31.8 27.6 M34.8 26 L34.6 28.1 M37 25.4 L37.6 27.4 M39 24.2 L40.2 25.8" stroke="#d9cdf2" stroke-width=".4" stroke-linecap="round" opacity=".75"/>
        <path d="M40.6 22.4 Q42.4 21.6 43.4 20.2" stroke="#f6e2a3" stroke-width=".45" fill="none" opacity=".6"/>
        <!-- 볼 털 -->
        <path d="M27 38 L24.6 41.6 M29 38.6 L27.4 42.6 M31 38.8 L30.2 42.8" stroke="#9f92c6" stroke-width=".35" opacity=".45"/>
        <!-- 수염 자리 + 수염 -->
        <circle cx="20" cy="32.6" r=".35" fill="#cfc6f0" opacity=".7"/><circle cx="21.4" cy="33.6" r=".35" fill="#cfc6f0" opacity=".7"/><circle cx="20.4" cy="34.8" r=".35" fill="#cfc6f0" opacity=".7"/>
        <path d="M20.4 32.8 Q6 26 -10 27 M21 33.8 Q6 32 -9 35 M20.8 35 Q8 37.6 -4 43 M22 33.2 Q34 30 44 33" stroke="#cfc6f0" stroke-width=".38" fill="none" opacity=".55"/>
        <!-- 담배 -->

function jdn(y,m,d){const a=Math.floor((14-m)/12),Y=y+4800-a,M=m+12*a-3;return d+Math.floor((153*M+2)/5)+365*Y+Math.floor(Y/4)-Math.floor(Y/100)+Math.floor(Y/400)-32045}
const rad=x=>x*Math.PI/180;
function sunLon(jd){ // Meeus 저정밀 태양 겉보기 황경
  const T=(jd-2451545)/36525;

  const C=(1.914602-0.004817*T)*Math.sin(rad(M))+(0.019993-0.000101*T)*Math.sin(rad(2*M))+0.000289*Math.sin(rad(3*M));
  const om=125.04-1934.136*T;
  return (((L0+C-0.00569-0.00478*Math.sin(rad(om)))%360)+360)%360;
}
function calcSaju(y,m,d,hh,mm,hasTime){
  // 시간 모르면 정오 기준으로 절기 판단
  const H=hasTime?hh:12, Mi=hasTime?mm:0;
  const jd=jdn(y,m,d)-0.5+(H-9+Mi/60)/24; // KST→UTC
  const lon=sunLon(jd);
  const mIdx=Math.floor((((lon-315)%360+360)%360)/30); // 0=寅월
  let yy=y; if(m<=2 && mIdx>=10) yy=y-1; // 입춘 전이면 전년도
  const ys=((yy-4)%10+10)%10, yb=((yy-4)%12+12)%12;
  const ms=((ys%5)*2+2+mIdx)%10, mb=(2+mIdx)%12;
  // 23시 이후는 다음날 자시로 침
  let dj=jdn(y,m,d); if(hasTime && hh>=23) dj+=1;
  const di=(dj+49)%60, ds=di%10, db=di%12;
  let hs=null,hb=null;
  if(hasTime){hb=Math.floor((hh+1)/2)%12; hs=((ds%5)*2+hb)%10;}
  return {year:[ys,yb],month:[ms,mb],day:[ds,db],hour:hasTime?[hs,hb]:null,sajuYear:yy};
}

 "庚午":"경오(庚午)일주. 불에 달군 쇠. 성질 급하고 말이 칼이다. 정의감에 불타는데 그 불이 주로 주변을 태운다. 본인이 맞는 말을 해도 말투 때문에 진다.",
 "辛未":"신미(辛未)일주. 흙 묻은 보석. 고상한 척하는데 고집은 염소다. 까다로운 입맛을 안목이라 착각하고, 남의 취향은 다 촌스럽다고 생각한다. 정작 자기 매력은 꺼내 쓸 줄 모른다.",

 "庚辰":"경진(庚辰)일주. 용 위에 얹힌 쇠. 자존심이 철갑이다. 지는 게 제일 싫어서 말싸움은 이기고 사람은 잃는다. 리더 기질이라 우기지만 그냥 고집이다.",

 "壬午":"임오(壬午)일주. 물과 불이 한 몸에. 감정 기복이 롤러코스터다. 아침엔 세상 다 가질 것 같고, 저녁엔 다 끝난 것 같다. 연애도 일도 뜨겁게 시작해서 미지근하게 끝난다.",

 "己丑":"기축(己丑)일주. 젖은 흙 위에 또 흙. 고집 더블. 한 번 정하면 아무도 못 바꾼다. 느리고 답답한데 본인은 그걸 '꾸준함'이라 부른다. 변화는 적이다.",
 "庚寅":"경인(庚寅)일주. 호랑이 잡는 쇠. 성격 급하고 직설적이다. 일단 지르고 수습은 남이 한다. 추진력이 아니라 브레이크가 없는 거다.",
 "辛卯":"신묘(辛卯)일주. 풀 베는 작은 칼. 말이 예리하고 은근 까칠하다. 웃으면서 툭 던진 한마디가 제일 아프다는 거, 본인만 모른다. 예쁜 것만 좋아하는 겉핥기 취향이다.",
 "壬辰":"임진(壬辰)일주. 용이 사는 바다. 야망은 하늘을 찌르는데 현실은 늪이다. 큰소리는 잘 치는데 결과물은 늘 '준비 중'. 남들이 자기 그릇을 몰라본다고 생각한다.",
 "癸巳":"계사(癸巳)일주. 불 위에 떨어진 빗물. 겉은 차분, 속은 조급. 머리 굴리느라 바빠서 정작 행동은 늦다. 남 속은 잘 꿰뚫는데 자기 속은 못 다스린다.",
 "甲午":"갑오(甲午)일주. 불타는 나무. 열정만 가득하고 끝은 재다. 하고 싶은 말 다 하고 다니다 적을 만든다. 솔직함과 무례함의 경계를 매일 넘는다.",
 "乙未":"을미(乙未)일주. 사막의 풀. 끈질긴 척하지만 그냥 못 놓는 거다. 사람도 물건도 미련도 못 버려서 인생이 창고다. 서운함 저장 용량은 무제한.",
 "丙申":"병신(丙申)일주. 쇳덩이를 비추는 태양. 이것저것 다 하고 싶은 산만함의 아이콘. 재주가 많다는 건 하나도 제대로 못 한다는 뜻이다. 말은 번지르르하고 뒷마무리는 남이 한다.",
 "丁酉":"정유(丁酉)일주. 촛불 아래 보석. 섬세하고 예쁜 거 좋아하는 만큼 까다롭다. 남한테 바라는 건 많고 주는 건 적다. 분위기는 좋은데 오래 있으면 피곤한 사람.",
 "戊戌":"무술(戊戌)일주. 산 위에 또 산. 고집의 끝판왕. 아무리 설득해도 꿈쩍 안 한다. 혼자서도 잘 지낸다는데, 그게 아니라 같이 있을 사람이 없는 거다.",
 "己亥":"기해(己亥)일주. 물에 쓸려가는 밭. 사람 좋다는 소리 듣는데 실은 우유부단이다. 누가 뭐라 하면 다 흔들린다. 결정은 남이 하고 후회는 본인이 한다.",
 "庚子":"경자(庚子)일주. 차가운 쇠와 찬물. 냉정함 만렙. 감정 표현을 약점이라 생각해서 다들 너를 로봇으로 안다. 맞는 말인데 듣고 나면 기분 나쁜 말만 골라서 한다.",
 "辛丑":"신축(辛丑)일주. 흙 속에 묻힌 보석. 자기는 원석인데 아무도 못 알아본다고 믿는다. 근데 계속 묻혀만 있으면 그냥 돌이다. 고집과 자존심이 땅속 깊이 박혀 있다.",
 "壬寅":"임인(壬寅)일주. 물 건너는 호랑이. 자유롭고 싶은데 책임은 싫다. 새로운 거 시작하는 건 일등, 끝내는 건 꼴등. 연락 두절의 장인이다.",
 "癸卯":"계묘(癸卯)일주. 이슬 맞은 토끼. 여리고 감성적인 척하며 보호받고 싶어 한다. 근데 은근 고집 세서 뜻대로 안 되면 토라진다. 귀여움으로 버티는 것도 유통기한이 있다.",
 "甲辰":"갑진(甲辰)일주. 용 등에 올라탄 나무. 자신감이 하늘을 찌르는데 근거는 없다. 남 밑에선 못 버티고 내가 해야 직성이 풀리는데, 막상 맡으면 남 탓한다.",
 "乙巳":"을사(乙巳)일주. 불 앞의 꽃. 화려하게 보이고 싶어 안달이다. 겉포장에 들인 공의 반만 실력에 썼어도 지금보다 나았다. 관심 없으면 시들고, 관심 많으면 피곤하게 군다.",
 "丙午":"병오(丙午)일주. 태양 위에 또 태양. 불 그 자체다. 자존심, 고집, 성질 다 최대치. '화끈하다'는 건 주변이 데인다는 뜻이다. 본인만 뜨거운 줄 모른다.",
 "丁未":"정미(丁未)일주. 마른 땅 위의 촛불. 겉은 온순, 속은 활화산. 참다 참다 터지면 아무도 못 말린다. 참은 걸 아무도 몰라준다고 서운해하는데, 말을 안 했잖아.",
 "戊申":"무신(戊申)일주. 산속 원숭이. 잔머리와 넉살로 버틴다. 일 벌이는 건 잘하는데 수습은 늘 미완성. 말로는 사업가, 현실은 아이디어 수집가.",
 "己酉":"기유(己酉)일주. 칼 든 농부. 꼼꼼하다 못해 잔소리꾼이다. 남의 흠은 현미경으로 보고 자기 흠은 망원경을 거꾸로 들고 본다. 완벽주의라 쓰고 남 피곤하게 하기라 읽는다.",
 "庚戌":"경술(庚戌)일주. 무쇠 문지기. 고집과 의리로 똘똘 뭉쳤다. 내 편 아니면 다 적이다. 융통성은 갖다 버렸고, 그 대가로 늘 싸운다.",
 "辛亥":"신해(辛亥)일주. 물에 씻긴 보석. 깔끔하고 예민하고 외롭다. 남들이 자기 수준을 못 따라온다고 생각하는데, 다들 그냥 안 따라가는 거다. 혼자 고고한 척하다 혼자 쓸쓸하다.",
 "壬子":"임자(壬子)일주. 바다 위에 또 바다. 속을 알 수 없는 게 매력인 줄 아는데 그냥 불투명한 거다. 감정이 넘쳐흘러도 표현은 안 해서 주변만 답답하다. 특기는 잠수.",
 "癸丑":"계축(癸丑)일주. 얼어붙은 빗물. 차갑고 고집스럽다. 묵묵히 버티는 척하지만 속엔 불만이 꽁꽁 얼어 쌓여 있다. 그게 녹는 날 홍수 난다.",
 "甲寅":"갑인(甲寅)일주. 숲의 왕 호랑이 나무. 자존심 더블. 누구 밑에도 안 들어가고 누구 말도 안 듣는다. 독립심이 아니라 그냥 어울릴 줄 모르는 거다.",
 "乙卯":"을묘(乙卯)일주. 덩굴 위에 또 덩굴. 유연한 척하지만 은근 질긴 고집이다. 남한테 기대면서 독립적인 척하는 모순 덩어리. 예민함도 두 배다.",
 "丙辰":"병진(丙辰)일주. 구름 낀 태양. 밝은 척하는데 속은 흐리다. 남 앞에선 해맑고 혼자 있을 땐 세상 걱정을 다 짊어진다. 오지랖은 넓은데 정작 자기 일은 흐지부지.",
 "丁巳":"정사(丁巳)일주. 불 위의 촛불. 예민하고 뜨겁다. 작은 일에도 확 타오르고 금방 꺼진다. 질투 숨기려고 쿨한 척하는데, 다 티 난다.",
 "戊午":"무오(戊午)일주. 화산. 겉은 묵직한 산, 속은 용암이다. 평소엔 조용하다가 한 번 터지면 주변이 초토화된다. 본인은 '나 원래 화 잘 안 내는데'라고 한다. 그 한 번이 매번이다.",
 "己未":"기미(己未)일주. 메마른 밭 위에 또 밭. 고집 위에 고집. 남 말은 귓등으로 듣고 자기 방식만 고수한다. 희생하는 척하면서 생색은 꼭 낸다.",
 "庚申":"경신(庚申)일주. 쇠 위에 또 쇠. 단단하다 못해 딱딱하다. 융통성 제로, 타협 제로. 옳고 그름만 따지다 사람 마음은 늘 놓친다. 말 한마디에 칼이 열 자루.",
 "辛酉":"신유(辛酉)일주. 보석 위에 또 보석. 자기애 최대치. 거울 보는 시간이 반성하는 시간보다 길다. 까다로운 기준을 높은 안목인 줄 아는데, 그냥 까다로운 거다.",
 "壬戌":"임술(壬戌)일주. 둑 앞에 출렁이는 바다. 속에 쌓아둔 게 많다. 겉은 호탕한데 뒤끝은 길다. 언젠가 둑이 터지는 날, 주변 사람들이 다 휩쓸린다.",
 "癸亥":"계해(癸亥)일주. 물 위에 물, 바다 밑에 또 빗물이다. 60갑자의 맨 끝자리라 그런지 인생도 늘 마감 직전에 허겁지겁이다. 감정이 홍수인데 둑이 없어서, 기분 좋으면 세상 다 품을 것처럼 굴다가 기분 상하면 그대로 잠수 탄다. 생각은 깊다고 우기는데, 깊은 게 아니라 그냥 어둡고 축축한 거다. 남들은 '속을 모르겠다'고 하는데 본인도 자기 속을 모른다."

  return r*2+((stem%2)===(dayStem%2)?0:1);
}

  if(cnt[muchI]>=3) relP.push(MUCH[muchI]);
  else if(lacks.length) relP.push(LACK[pick(r,lacks)]);
  const noneG=tg.map((c,i)=>c===0&&i!==2?i:-1).filter(i=>i>=0); // 재성 없음은 돈 칸에서
  if(noneG.length) relP.push(NONE5[pick(r,noneG)]);
  else relP.push(pick(r,REL_X));
  out.push({ico:"🔮",t:"관계",p:relP});
  // 연애
  let love2;
  if(tg[2]===0&&tg[3]===0) love2="사주에 연애 기운이 아예 안 적혀 있다. 그래도 계속 찾는 거 보면 의지는 대단하다.";
  else if(ten[3]>=2) love2="'할 말은 한다' 기운이 세서 연애에서도 말로 이기려 든다. 이기고 나서 혼자 남는다.";
  else if(tg[3]>=3) love2="나를 누르는 기운이 많아서 늘 끌리는 건 나를 힘들게 하는 사람이다. 연애 취향이 고생 체험이다.";
  else if(tg[2]>=3) love2="이성 기운이 넘쳐서 썸은 많은데 정리가 안 된다. 다 애매하게 걸쳐 두다 다 놓친다.";
  else if(tg[0]>=3) love2="'친구·내 편' 기운이 많아서 애인보다 친구가 먼저다. 그 친구들도 네가 왜 연애를 못 하는지 안다.";
  else if(tg[4]>=3) love2="'보살핌 받고 싶은' 기운이 많다. 애인을 보호자로 착각하지 마라.";
  else if(tg[1]>=3) love2="'말발' 기운이 많아서 연애 초반엔 말이 술술 나오는데, 석 달 지나면 할 말이 없다.";
  else love2="연애 기운 배치는 그럭저럭 무난하다. 문제는 구조가 아니라 너다.";
  out.push({ico:"💔",t:"연애",p:[LOVE[s.day[1]],love2,pick(r,LOVE_X)]});
  // 돈
  const mp=[MONEY[Math.min(tg[2],3)]];
  if(maxTg!==2 && MONEY_ADD[maxTg]) mp.push(MONEY_ADD[maxTg]);
  mp.push(pick(r,MONEY_X));
  out.push({ico:"💸",t:"돈",p:mp});
  // 직업
  out.push({ico:"💼",t:"직업",p:[JOB10[topTen],MONTHB[s.month[1]],pick(r,JOB_X)]});
  // 자기합리화
  out.push({ico:"🪞",t:"자기합리화",p:[EXCUSE[dEl],EXCUSE10[topTen], s.hour?HOURB[s.hour[1]]:"태어난 시간도 모른다. 자기 속도 모르는 사람다운 선택이다."]});
  // 올해 경고
  const now=new Date(), cy=now.getFullYear();
  const cys=((cy-4)%10+10)%10, cyb=((cy-4)%12+12)%12;
  const wp=["올해는 "+WARN10[tenOf(ds,cys)]];
  if((cyb-s.day[1]+12)%12===6) wp.push("게다가 올해 기운이 네 타고난 기운과 정면으로 부딪힌다. 집, 연애, 생활 패턴 중 하나는 한 번 뒤집힌다.");
  else if(cyb===s.day[1]) wp.push("올해 기운이 네 타고난 기운과 판박이다. 작년에 한 실수를 똑같이 한 번 더 하는 해다.");
  if((cyb-s.year[1]+12)%12===6) wp.push(`올해는 네 ${ZODIAC[s.year[1]]}띠와도 정면으로 부딪힌다. 이사나 이직 생각이 나도 일단 참아라.`);
  else if(cyb===s.year[1]) wp.push(`${ZODIAC[s.year[1]]}띠 해, 본인 띠의 해다. 들뜨지 마라. 띠의 해는 원래 조용히 지나가는 게 이득이다.`);
  if(wp.length<3) wp.push(pick(r,WARN_X));
  out.push({ico:"⚠️",t:`${cy}년 ${STEM_K[cys]}${BR_K[cyb]}(${STEM[cys]}${BR[cyb]})년 경고`,warn:true,p:wp});
  // 냥선생
  out.push({ico:"🐈‍⬛",t:"냥선생의 한마디",cat:true,p:[pick(r,CAT)]});
  return {out,cnt,tg,ilju};
}

/* ================= 화면 ================= */
const $=id=>document.getElementById(id);
function gzBox(p){
  if(!p) return `<div class="gz empty">?<small>모름</small></div><div class="gz empty">?<small>모름</small></div>`;
  return `<div class="gz e${STEM_EL[p[0]]}">${STEM[p[0]]}<small>${STEM_K[p[0]]}·${EL[STEM_EL[p[0]]]}</small></div>
          <div class="gz e${BR_EL[p[1]]}">${BR[p[1]]}<small>${BR_K[p[1]]}·${EL[BR_EL[p[1]]]}</small></div>`;
}
let lastText="";
function render(s,name){
  const cols=[["시주",s.hour],["일주",s.day,1],["월주",s.month],["년주",s.year]];
  $("pillars").innerHTML=cols.map(([l,p,d])=>`<div class="pillar${d?" day":""}"><div class="lbl">${l}${d?" · 나":""}</div>${gzBox(p)}</div>`).join("");
  const R=reading(s,name);
  const who=name?`<b>${esc(name)}</b>, `:"";
  $("ilju").innerHTML=`${who}너는 <b>${STEM_K[s.day[0]]}${BR_K[s.day[1]]}(${R.ilju})일주</b>다. 너를 상징하는 기운은 ${EL_EASY[STEM_EL[s.day[0]]]}(${EL_H[STEM_EL[s.day[0]]]}).`;
  const max=Math.max(...R.cnt,1);
  $("elements").innerHTML=R.cnt.map((c,i)=>`<div class="el"><div class="bar"><div class="fill" style="height:0;background:linear-gradient(to top,${EL_COLOR[i]},${EL_COLOR[i]}55)" data-h="${c/max*100}"></div></div><b>${c}</b>${EL_EASY[i]} ${EL_H[i]}</div>`).join("");
  const z=R.cnt.map((c,i)=>c===0?i:-1).filter(i=>i>=0);
  const top=R.cnt.indexOf(Math.max(...R.cnt));
  $("elcap").textContent=z.length?`${z.map(i=>EL_EASY[i]).join("·")} 기운이 아예 없다. 빈칸 많은 인생인데 ${EL_EASY[top]} 기운만 ${R.cnt[top]}개나 쌓아놨네.`
                                  :`${EL_EASY[top]} 기운이 ${R.cnt[top]}개로 제일 많다. 한쪽으로 쏠린 건 사주나 성격이나 똑같다.`;
  $("cards").innerHTML=R.out.map(c=>`<article class="card${c.cat?" catcard":""}${c.warn?" warn":""}"><h3><span class="ico">${c.ico}</span>${c.t}</h3>${c.p.map(x=>`<p>${x}</p>`).join("")}</article>`).join("");
  const pill=cols.slice().reverse().map(([l,p])=>`${l} ${p?STEM[p[0]]+BR[p[1]]:"??"}`).join(" / ");
  lastText=`🌙 어둠의 사주 — ${name?name+"의 ":""}${R.ilju}일주\n${pill}\n\n`+R.out.map(c=>`${c.ico} ${c.t}\n${c.p.join(" ")}`).join("\n\n")+"\n\n— 냥선생";
  requestAnimationFrame(()=>setTimeout(()=>{
    document.querySelectorAll(".fill").forEach(f=>f.style.height=f.dataset.h+"%");
  },80));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");io.unobserve(e.target)}}),{threshold:.15});
  document.querySelectorAll(".card").forEach((c,i)=>{c.style.transitionDelay=(i%3)*0.08+"s";io.observe(c)});
}
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LOADS=["냥선생이 꼬리로 점치는 중…","달빛에 네 팔자 비춰보는 중… 어둡다.","연기 속에서 단점 세는 중… 아직 세는 중."];
function parseDate(v){
  let y,m,d; const dg=v.replace(/\D/g,""); const parts=v.split(/\D+/).filter(Boolean);
  if(parts.length>=3){[y,m,d]=parts.map(Number); if(y<100) y+= y>(new Date().getFullYear()%100)?1900:2000;}
  else if(dg.length===8){y=+dg.slice(0,4);m=+dg.slice(4,6);d=+dg.slice(6,8);}
  else if(dg.length===6){y=+dg.slice(0,2);m=+dg.slice(2,4);d=+dg.slice(4,6);y+= y>(new Date().getFullYear()%100)?1900:2000;}
  else return null;
  const t=new Date(y,m-1,d);
  if(y<1900||y>2099||t.getFullYear()!==y||t.getMonth()!==m-1||t.getDate()!==d) return null;
  return [y,m,d];
}
function parseTime(v){
  const pm=/오후|밤|저녁|pm/i.test(v), am=/오전|새벽|아침|am/i.test(v);
  const nums=v.match(/\d+/g); if(!nums) return null;
  let h,mi=0;
  if(nums.length===1&&nums[0].length>=3){const n=nums[0].padStart(4,"0");h=+n.slice(0,2);mi=+n.slice(2,4);}
  else{h=+nums[0]; if(nums[1]) mi=+nums[1]; if(/반/.test(v)&&!nums[1]) mi=30;}
  if(pm&&h<12) h+=12; if(am&&h===12) h=0;
  if(h>23||mi>59) return null;
  return [h,mi];
}
function run(){
  const v=$("date").value.trim();
  if(!v){bubble("생년월일도 안 넣고 뭘 보겠다는 거냐. <b>기본부터</b> 해라.");return}
  const D=parseDate(v);
  if(!D){bubble("날짜가 이상하다. <b>19950731</b>처럼 여덟 자리로 넣어라. 그것도 어렵냐.");return}
  const [y,m,d]=D;
  const tv=$("time").value.trim();
  let T=null;
  if(!$("notime").checked && tv){T=parseTime(tv); if(!T){bubble("시간을 못 알아먹겠다. <b>2230</b>이나 <b>밤 10시 30분</b>처럼 써라.");return}}
  const noT=!T;
  const [hh,mm]=noT?[0,0]:T;
  const s=calcSaju(y,m,d,hh,mm,!noT);
  const name=$("name").value.trim();
  $("result").style.display="none";$("loading").style.display="block";
  $("loadmsg").textContent=pick(Math.random,LOADS);
  $("loading").scrollIntoView({behavior:"smooth",block:"center"});
  setTimeout(()=>{
    $("loading").style.display="none";$("result").style.display="block";
    render(s,name);
    bubble(noT?"시간도 모르면서 사주를 보겠다고? 뭐, <b>시주 없이</b> 대충 털어주지.":"다 봤다. 마음의 준비 했냐? 안 했어도 <b>읽어라</b>.");
    $("result").scrollIntoView({behavior:"smooth"});
  },1500);
}
function bubble(h){$("bubble").innerHTML=h}
$("go").onclick=run;
$("sample").onclick=()=>{$("name").value="계해씨";$("date").value="1995-07-31";$("time").value="22:30";$("notime").checked=false;run()};
$("notime").onchange=e=>{$("time").disabled=e.target.checked};
$("again").onclick=()=>{$("result").style.display="none";window.scrollTo({top:0,behavior:"smooth"});bubble("또 누굴 털려고? 좋다, <b>내놔봐</b>.")};
$("copy").onclick=()=>{navigator.clipboard?.writeText(lastText).then(()=>{$("toast").classList.add("on");clearTimeout(window._tt);window._tt=setTimeout(()=>$("toast").classList.remove("on"),4000)})};

/* ================= 배경 연출 ================= */
(function(){
  const c=$("stars"),x=c.getContext("2d");let st=[];
  function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;
    st=Array.from({length:Math.floor(innerWidth*innerHeight/5000)},()=>({x:Math.random()*c.width,y:Math.random()*c.height*.8,r:Math.random()*1.3*devicePixelRatio+.2,p:Math.random()*6.28,s:.5+Math.random()*1.5}))}
  size();addEventListener("resize",size);
  (function loop(t){x.clearRect(0,0,c.width,c.height);
    for(const s of st){const a=.35+.65*Math.abs(Math.sin(s.p+t/1000*s.s*.6));x.globalAlpha=a;x.fillStyle=s.r>1.4?"#f6e2a3":"#cfc6f0";x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()}
    requestAnimationFrame(loop)})(0);
  for(let i=0;i<18;i++){const m=document.createElement("div");m.className="mote";m.style.left=Math.random()*100+"vw";
    m.style.animationDuration=10+Math.random()*14+"s";m.style.animationDelay=-Math.random()*20+"s";const z=2+Math.random()*3;m.style.width=m.style.height=z+"px";document.body.appendChild(m)}
  const P=["✿","❀","✾","❁"];
  for(let i=0;i<10;i++){const p=document.createElement("div");p.className="petal";p.textContent=P[i%4];
    if(i%5===0){p.style.color="#c4303f";p.style.textShadow="0 0 6px rgba(196,48,63,.8)"}
    p.style.left=Math.random()*100+"vw";p.style.animationDuration=16+Math.random()*16+"s";p.style.animationDelay=-Math.random()*30+"s";p.style.fontSize=10+Math.random()*8+"px";document.body.appendChild(p)}
})();
